name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    # Opening or updating a pull request runs this workflow twice. Hosted
    # macOS arm64 runners were cancelled when both events requested one, so
    # only pull_request (and pushes to main) request macOS.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || matrix.os != 'macos-latest'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is Ubuntu 26.04. setup-python has no 3.8 or 3.9
        # builds for that image, so those versions stay on ubuntu-22.04.
        include:
          - os: ubuntu-22.04
            python-version: "3.8"
          - os: ubuntu-22.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest -q
      - run: gitignore --help
      - run: gitignore list

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: python -m pip check
      - run: gitignore generate python -o "$RUNNER_TEMP/generated.gitignore"
